<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>פרויקט ה-DevOps שלי</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #38bdf8;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .tag {
            display: inline-block;
            background-color: #0284c7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>האתר שלי באוויר! 🚀</h1>
        <p>פרויקט DevOps מקצה לקצה: Docker, Git, CI/CD ו-Kubernetes</p>
        <span class="tag">גרסה: v2.0 🚀 שדרוג הצליח!</span>
    </div>
</body>
</html>
